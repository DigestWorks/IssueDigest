[project]
name = "issuedigest-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["httpx2==2.13.1", "pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0"]

[tool.uv]
required-version = "==0.11.4"

[tool.uv.workspace]
members = ["apps/worker", "apps/api", "packages/domain", "packages/storage", "packages/ingestion", "packages/agents", "packages/connectors"]

[tool.pytest.ini_options]
testpaths = ["apps/worker/tests", "apps/api/tests", "packages/domain/tests", "packages/agents/tests", "packages/storage/tests", "packages/ui/tests", "packages/ingestion/tests", "packages/connectors/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps/worker/src", "apps/api/src", "packages/domain/src", "packages/storage/src", "packages/storage/migrations", "scripts/export_openapi.py", "scripts/question_briefing_app.py", "packages/ingestion/src", "packages/agents/src", "packages/connectors/src"]
