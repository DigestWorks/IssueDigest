name: Verify foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.19.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.4'
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.13.12
      - name: Install workspaces from lockfiles
        run: |
          npm ci
          npm run setup
      - name: Python and TypeScript checks, tests, SPA build, contract drift
        run: npm run check
