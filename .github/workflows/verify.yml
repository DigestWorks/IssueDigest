name: Verify foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: issuedigest_test
          POSTGRES_PASSWORD: issuedigest_test
          POSTGRES_DB: issuedigest_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U issuedigest_test -d issuedigest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ISSUEDIGEST_TEST_DATABASE_URL: postgresql+psycopg://issuedigest_test:issuedigest_test@127.0.0.1:5432/issuedigest_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.19.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.4'
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.13.12
      - name: Install workspaces from lockfiles
        run: |
          npm ci
          npm run setup
      - name: Python and TypeScript checks, tests, SPA build, contract drift
        run: npm run check
