name: issuedigest-db
services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: issuedigest-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    cpus: 0.5
    mem_limit: 1g
    shm_size: 128m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - admin_password
      - developer_password
      - app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sh:/docker-entrypoint-initdb.d/10-issuedigest.sh:ro
      - ./init.sql:/opt/issuedigest/init.sql:ro
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d issuedigest"]
      interval: 10s
      timeout: 5s
      retries: 6
secrets:
  admin_password:
    file: ./secrets/admin_password
  developer_password:
    file: ./secrets/developer_password
  app_password:
    file: ./secrets/app_password
volumes:
  postgres_data:
    name: issuedigest_postgres_data
