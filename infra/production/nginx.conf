server {
    listen 80;
    listen [::]:80;
    server_name issuedigest.projects.ai.kr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name issuedigest.projects.ai.kr;
    ssl_certificate /etc/letsencrypt/live/issuedigest.projects.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/issuedigest.projects.ai.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/issuedigest/current/apps/web/build/client;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:18190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        if (!-f $document_root/index.html) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}
